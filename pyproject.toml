[project]
name = "aqua"
version = "0.1.0"
description = "Agent Questions & User Answers: an inbox where agents ask their user questions with full context"
authors = [
    { name = "Kevin Willis" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.146.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]
mcp = [
    "mcp>=2.3.0",
]

[project.scripts]
aqua = "aqua:main"
aqua-server = "aqua:serve"
aqua-mcp = "aqua.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
